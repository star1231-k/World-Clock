<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="CSS/style.css" />
    <title>World Clock - Keena T</title>
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>
      <select>
        <option value="">Select a city..</option>
        <option value="">Kyzal</option>
        <option value="">Amsterdam</option>
        <option value="">Edinburgh</option>
        <option value="">Boston</option>
      </select>
      <div>
        <div class="city">
          <div>
          <h2>Kyzal</h2>
          <div class="date">November 9th 2026</div>
          </div>
          <div class="time">1:38 <small> PM </small></div>
        </div>
        <div class="city"><div>
          <h2>Amsterdam</h2>
          <div class="date">November 9th 2026</div>
          </div>
          <div class="time">1:38 <small> PM </small></div>
        </div>
        <div class="city">
          <div>
          <h2>Edinburgh</h2>
          <div class="date">November 9th 2026</div>
          </div>
          <div class="time">1:38 <small> PM </small></div>
        </div>
        <div class="city">
          <div>
          <h2>Boston</h2>
          <div class="date">November 9th 2026</div>
          </div>
          <div class="time">1:38 <small> PM </small></div>
        </div>
      </div>
    </div>
    <footer>
      This project was coded with 💗 by <strong>Keena T</strong> and is
      <a href="https://github.com/star1231-k/World-Clock" target="_blank"
        >open sourced on Github</a
      >
      hosted on <a href="https://wckmt.netlify.app" target="_blank">Netlify</a>.
    </footer>
    <script src="Javascript/index.js"></script>
  </body>
</html>
